[package]
name = "nook-platform"
description = "Thin, error-checked wrappers over the Win32/DWM (Windows) and X11/portal/D-Bus (Linux) APIs Nook needs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
image.workspace = true
candle-core = "0.9"
candle-nn = "0.9"
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-numerics = "0.3"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
  "Foundation",
  "Foundation_Numerics",
  "Foundation_Collections",
  "Globalization",
  "Graphics",
  "Graphics_Imaging",
  "Media_Control",
  "Media_Ocr",
  "Storage_Streams",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_System_WinRT_Graphics_Direct2D",
  "Win32_Graphics_Dwm",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_IO",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

# Linux (Fedora GNOME): the overlay runs as an X11 client (XWayland on a
# Wayland session), screen grabs and the wallpaper go through the desktop
# portal, media, power and settings through D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shape", "randr", "xfixes", "allow-unsafe-code"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2"
serde.workspace = true
# Text in burned-in annotations, the snip overlay and font matching
# (GDI on Windows).
ab_glyph = "0.2"
# Copying images and reading the clipboard (the X11 selection protocol).
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
# Album art that players serve over HTTP(S).
ureq = { version = "2.12", default-features = false, features = ["tls"] }
