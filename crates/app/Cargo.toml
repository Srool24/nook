[package]
name = "nook-app"
description = "Nook: a floating notch utility hub for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nook"
path = "src/main.rs"

[features]
default = []
# Shows frame time and repaint causes in a small overlay.
debug-overlay = []

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
tray-icon.workspace = true
global-hotkey.workspace = true
serde.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
raw-window-handle = "0.6"
# Update checks against GitHub Releases (same TLS stack as the plugin installer).
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
serde_json = "1"
ring = "0.17"
nook-ui.workspace = true
nook-platform.workspace = true
nook-modules.workspace = true

# The overlay is an X11 client on Linux (XWayland on GNOME): Wayland clients
# cannot place themselves, stay on top or let clicks through a shape.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11"] }
# To pick winit's X11 backend at run time: accesskit (screen readers) also
# builds in the Wayland one, which winit would otherwise prefer on GNOME.
winit = { version = "0.30", default-features = false, features = ["x11"] }
# The tray icon (AppIndicator) needs GTK running on a thread of its own.
gtk = "0.18"
glib = "0.18"
image.workspace = true

[build-dependencies]
winresource = "0.1"
